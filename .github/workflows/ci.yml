name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up Node (for Playwright CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright system deps and browsers
        run: |
          # Use the Playwright CLI via npx to install required OS deps and browser
          npx playwright@1.37.0 install --with-deps chromium
      - name: Run tests
        run: |
          pytest -q
